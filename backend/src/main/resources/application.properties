# Server Configuration
server.port=8080

# Application Name
spring.application.name=all-in-a-go-backend

# H2 In-Memory Database Configuration (Zero-setup for college viva & local development)
spring.datasource.url=jdbc:h2:mem:allinagodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console during demo/viva)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# PostgreSQL configuration template for cloud deployment (e.g. Render)
# If DATABASE_URL or SPRING_DATASOURCE_URL is supplied in environment, Spring will override the above.
